services:
  - type: web
    name: winter-olympics-medal-pool
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: pool-data
      mountPath: /var/data
      sizeGB: 1
